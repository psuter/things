<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ed">
  <title>Plotter · Live drawing</title>
  <link rel="stylesheet" href="./companion.css">
</head>
<body>
<div class="companion-app">
  <header class="companion-header"><a href="./" aria-label="Back to Plotter">P /</a><div><p class="eyebrow">PEN &amp; PAPER</p><h1>Live drawing</h1></div><output id="link-state" class="state">Not connected</output></header>
  <details id="pairing" class="pairing" open>
    <summary>Pair with PlotUI</summary>
    <div class="pairing-grid">
      <button id="scan-offer" class="primary">Scan invitation QR</button>
      <canvas id="answer-qr" aria-label="Reply QR code" hidden></canvas>
    </div>
    <p id="pairing-status" role="status"></p>
  </details>
  <main class="drawing-workspace">
    <div class="drawing-toolbar">
      <div class="tool-group" role="group" aria-label="Drawing tools"><button id="draw-tool" class="tool selected" aria-pressed="true">Draw</button><button id="erase-tool" class="tool" aria-pressed="false">Erase</button></div>
      <button id="undo" disabled>Undo</button><button id="clear" disabled>Clear</button><span class="toolbar-spacer"></span><button id="plot" class="primary plot-button" disabled>Plot!</button>
    </div>
    <div id="page-wrap" class="page-wrap"><canvas id="draw-canvas" aria-label="Drawing page" aria-disabled="true"></canvas></div>
    <output id="drawing-state" class="drawing-state">Connect to PlotUI to load the calibrated page.</output>
  </main>
</div>
<script src="./vendor/qrcode-generator.js"></script>
<script src="./vendor/jsqr.js"></script>
<script type="module" src="./companion.js"></script>
</body>
</html>
