<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10191d"><title>Magellan · Dimetric Terrain Lab</title>  <script type="module" crossorigin src="/magellan/assets/editor-DtgR7xHK.js"></script>
  <link rel="modulepreload" crossorigin href="/magellan/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/magellan/assets/foliage-atlas-BmKxc5zR.js">
  <link rel="stylesheet" crossorigin href="/magellan/assets/editor-DryhkGHO.css">
</head>
  <body class="iso-page">
    <main class="iso-shell">
      <div id="iso-controls" class="iso-controls">
        <div class="rotation-control" role="group" aria-label="Map rotation">
          <span>Up-left <output id="iso-bearing">West</output></span>
          <button id="iso-rotate-left" type="button" class="secondary rotation-button" aria-label="Rotate map 90 degrees left" title="Rotate 90° left"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 11H3V6"/><path d="M4 10a13 13 0 1 1-1 11"/></svg></button>
          <button id="iso-rotate-right" type="button" class="secondary rotation-button" aria-label="Rotate map 90 degrees right" title="Rotate 90° right"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M24 11h5V6"/><path d="M28 10a13 13 0 1 0 1 11"/></svg></button>
        </div>
        <label class="check"><input id="iso-fill" type="checkbox" checked> Surface fill</label>
        <button id="iso-pixels" type="button" class="secondary" aria-pressed="false">Flat pixels</button>
        <button id="iso-structure" type="button" class="secondary" aria-pressed="true">Hide grid</button>
        <button id="iso-save" type="button" class="secondary">Save map</button>
        <button id="iso-load" type="button" class="secondary">Load map</button>
        <input id="iso-load-file" type="file" accept="application/json,.json" hidden>
        <button id="iso-export-capture" type="button" class="secondary" disabled>Export capture</button>
        <button id="iso-import-painted" type="button" class="secondary">Import painted</button>
        <input id="iso-import-painted-files" type="file" accept="image/png,application/json,.png,.json" multiple hidden>
        <button id="iso-clear" type="button" class="secondary">Reset to sea</button>
        <button id="iso-reset" type="button" class="secondary">Reset view</button>
      </div>
      <section class="iso-frame">
        <canvas id="iso-canvas" aria-label="Editable dimetric terrain"></canvas>
        <div class="terrain-tools" role="toolbar" aria-label="Terraforming tools">
          <div class="terrain-tool-group">
            <button id="tool-select" class="terrain-tool" type="button" aria-label="Open selection tools" aria-expanded="false" aria-pressed="false" title="Selection tools">
              <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 5l18 12-8 2-4 8z"/><path d="M18 21l6 6"/></svg><span>Select</span>
            </button>
            <div id="selection-tools" class="terrain-submenu selection-submenu" role="menu" aria-label="Selection tools" hidden>
              <button id="tool-multi" class="terrain-tool" type="button" role="menuitem" aria-pressed="false" title="Paint tiles into or out of the selection"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 10l7-4 7 4-7 4zM15 18l7-4 7 4-7 4zM3 24l7-4 7 4-7 4z"/><path d="M22 5v7m-3-3h6"/></svg><span>Multi</span></button>
              <button id="tool-lasso" class="terrain-tool" type="button" role="menuitem" aria-pressed="false" title="Lasso nodes"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M24 8c5 3 4 10-1 14-5 4-14 4-17-1-3-5 3-12 10-14 4-1 7-1 8 1z"/><path d="M23 22c0 4 2 6 5 5"/></svg><span>Lasso</span></button>
              <button id="tool-flood" class="terrain-tool" type="button" role="menuitem" aria-pressed="false" title="Select contiguous flat tiles at one level"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 17l8-5 8 5-8 5zM12 12l8-5 8 5-8 5zM12 22l8-5 8 5-8 5z"/><path d="M4 26h24"/></svg><span>Flood</span></button>
              <button id="tool-selection-clear" class="terrain-tool" type="button" role="menuitem" title="Clear the current selection"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 7l18 18M25 7L7 25"/><path d="M4 4h24v24H4z"/></svg><span>Clear</span></button>
            </div>
          </div>
          <button id="tool-plane" class="terrain-tool" type="button" aria-label="Plane tiles to a flat reference" aria-pressed="false" title="Plane tiles">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 21l8-8h14l2 8zM10 21v5h14v-5M14 13V7h7v6"/><path d="M3 28h26"/></svg><span>Plane</span>
          </button>
          <div class="terrain-tool-group">
            <button id="tool-cliff" class="terrain-tool" type="button" aria-label="Open cliff tools" aria-expanded="false" aria-pressed="false" title="Cliff tools">
              <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 9h11l4 5h11M3 23h9l6-9"/><path d="M14 9v7l-2 7M18 14v9h11"/></svg><span>Cliffs</span>
            </button>
            <div id="cliff-tools" class="terrain-submenu" role="menu" aria-label="Cliff tools" hidden>
              <button id="tool-cliff-draw" class="terrain-tool" type="button" role="menuitem" aria-pressed="false" title="Draw and snap a cliff line"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 25c5-12 10-15 22-18M6 20l6 6M21 6l5 5"/></svg><span>Draw</span></button>
              <button id="tool-cliff-erase" class="terrain-tool" type="button" role="menuitem" aria-pressed="false" title="Swipe to erase cliff lines"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 20L18 7l9 9-10 10H9zM13 25h15"/><path d="M9 16l9 9"/></svg><span>Erase</span></button>
              <button id="tool-cliff-simplify" class="terrain-tool" type="button" role="menuitem" title="Remove cliff marks with no height break"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 10h7l4 5h5l3-3h5M4 23h8l4-4h12"/><path d="M22 5l6 6-6 6"/></svg><span>Simplify</span></button>
            </div>
          </div>
          <button id="tool-capture" class="terrain-tool" type="button" aria-label="Select a pixel-art terrain capture area" aria-pressed="false" title="Capture elevated terrain area">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 9V5h4M23 5h4v4M27 23v4h-4M9 27H5v-4"/><path d="M8 17l8-5 8 5-8 5z"/></svg><span>Capture</span>
          </button>
          <span class="tool-divider" aria-hidden="true"></span>
          <button id="tool-raise" class="terrain-tool" type="button" aria-label="Raise selection" title="Raise selection" disabled><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 20l11-6 11 6-11 6z"/><path d="M16 16V5m-5 5 5-5 5 5"/></svg><span>Raise</span></button>
          <button id="tool-lower" class="terrain-tool" type="button" aria-label="Lower selection" title="Lower selection" disabled><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12l11-6 11 6-11 6z"/><path d="M16 16v11m-5-5 5 5 5-5"/></svg><span>Lower</span></button>
          <button id="tool-land" class="terrain-tool terrain-tool-material" type="button" aria-label="Turn selection to land" title="Turn selection to land" disabled><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 23c5-7 8-12 13-12s8 5 13 12z"/><path d="M8 23h16M12 18h8"/></svg><span>Land</span></button>
          <button id="tool-water" class="terrain-tool terrain-tool-material" type="button" aria-label="Turn selection to water" title="Turn selection to water" disabled><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 12c3 0 3 3 6 3s3-3 6-3 3 3 6 3 3-3 6-3M3 20c3 0 3 3 6 3s3-3 6-3 3 3 6 3 3-3 6-3"/></svg><span>Water</span></button>
          <button id="tool-foliage" class="terrain-tool" type="button" aria-label="Open foliage picker" aria-pressed="false" title="Foliage"><span>Foliage</span></button>
        </div>
        <aside id="foliage-lab" class="decor-lab" hidden><header><strong>Foliage</strong><button id="foliage-close" type="button" class="secondary">×</button></header><label>Type<select id="foliage-picker"><option value="1">Tall grasses</option><option value="2">Dry beach grass / reeds</option><option value="3">Low shrubs</option><option value="4">Tropical forest</option></select></label><label>Density <output id="foliage-density-editor-value">2</output><input id="foliage-density-editor" type="range" min="1" max="4" value="2"></label><div class="decor-actions"><button id="foliage-attach" type="button">Paint selection</button><button id="foliage-clear" type="button" class="secondary">Clear selection</button></div><p>Foliage is stored per tile and is cleared automatically when terrain edits make a tile unsuitable.</p></aside>
        <aside id="capture-review" class="capture-review" hidden>
          <img id="capture-review-image" alt="Imported painted capture preview">
          <div><strong>Painted capture ready</strong><p id="capture-review-status"></p><button id="capture-approve" type="button">Approve slices</button><button id="capture-cancel" type="button" class="secondary">Cancel</button></div>
        </aside>
        <div class="iso-badge"><span id="iso-status">Generating…</span><span id="iso-missing"></span><span id="iso-scale"></span></div>
      </section>
      <footer class="iso-footer"><a href="./assets.html">Asset foundry</a> · <a href="./foliage.html">Foliage studio</a></footer>
    </main>
  </body>
</html>
