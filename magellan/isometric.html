<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10191d"><title>Magellan · Dimetric Terrain Lab</title>  <script type="module" crossorigin src="/magellan/assets/isometric-DBk3wmMD.js"></script>
  <link rel="modulepreload" crossorigin href="/magellan/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/magellan/assets/isometric-B7pYkocv.css">
</head>
  <body class="iso-page">
    <main class="iso-shell">
      <div id="iso-controls" class="iso-controls">
        <label>View <select id="iso-rotation"><option value="0">South</option><option value="1">West</option><option value="2">North</option><option value="3">East</option></select></label>
        <label class="check"><input id="iso-fill" type="checkbox" checked> Surface fill</label>
        <button id="iso-structure" type="button" class="secondary" aria-pressed="true">Hide grid</button>
        <button id="iso-save" type="button" class="secondary">Save map</button>
        <button id="iso-load" type="button" class="secondary">Load map</button>
        <input id="iso-load-file" type="file" accept="application/json,.json" hidden>
        <button id="iso-clear" type="button" class="secondary">Reset to sea</button>
        <button id="iso-reset" type="button" class="secondary">Reset view</button>
      </div>
      <section class="iso-frame">
        <canvas id="iso-canvas" aria-label="Editable dimetric terrain"></canvas>
        <div class="terrain-tools" role="toolbar" aria-label="Terraforming tools">
          <button id="tool-multi" class="terrain-tool" type="button" aria-label="Toggle multiple tile selection" aria-pressed="false" title="Select multiple tiles">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 10l7-4 7 4-7 4zM15 18l7-4 7 4-7 4zM3 24l7-4 7 4-7 4z"/><path d="M22 5v7m-3-3h6"/></svg><span>Multi</span>
          </button>
          <button id="tool-lasso" class="terrain-tool" type="button" aria-label="Lasso nodes" aria-pressed="false" title="Lasso nodes">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M24 8c5 3 4 10-1 14-5 4-14 4-17-1-3-5 3-12 10-14 4-1 7-1 8 1z"/><path d="M23 22c0 4 2 6 5 5"/></svg><span>Lasso</span>
          </button>
          <span class="tool-divider" aria-hidden="true"></span>
          <button id="tool-raise" class="terrain-tool" type="button" aria-label="Raise selection" title="Raise selection" disabled>
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 20l11-6 11 6-11 6z"/><path d="M16 16V5m-5 5 5-5 5 5"/></svg><span>Raise</span>
          </button>
          <button id="tool-lower" class="terrain-tool" type="button" aria-label="Lower selection" title="Lower selection" disabled>
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12l11-6 11 6-11 6z"/><path d="M16 16v11m-5-5 5 5 5-5"/></svg><span>Lower</span>
          </button>
          <button id="tool-land" class="terrain-tool terrain-tool-material" type="button" aria-label="Turn selection to land" title="Turn selection to land" disabled>
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 23c5-7 8-12 13-12s8 5 13 12z"/><path d="M8 23h16M12 18h8"/></svg><span>Land</span>
          </button>
          <button id="tool-water" class="terrain-tool terrain-tool-material" type="button" aria-label="Turn selection to water" title="Turn selection to water" disabled>
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 12c3 0 3 3 6 3s3-3 6-3 3 3 6 3 3-3 6-3M3 20c3 0 3 3 6 3s3-3 6-3 3 3 6 3 3-3 6-3"/></svg><span>Water</span>
          </button>
        </div>
        <div class="iso-badge"><span id="iso-status">Generating…</span><span id="iso-scale"></span></div>
      </section>
      <footer class="iso-footer"><a href="./">Sailing prototype</a><a href="./map.html">Flat map workshop</a><a href="./assets.html">Asset foundry</a></footer>
    </main>
  </body>
</html>
