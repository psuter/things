<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10191d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Magellan"><title>Magellan · Game</title>  <script type="module" crossorigin src="/magellan/assets/game-DK8rAHOk.js"></script>
  <link rel="modulepreload" crossorigin href="/magellan/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/magellan/assets/terrain-visuals-DeiHI72v.js">
  <link rel="modulepreload" crossorigin href="/magellan/assets/foliage-atlas-BmKxc5zR.js">
  <link rel="modulepreload" crossorigin href="/magellan/assets/compile-runtime-Ph5IG8NO.js">
  <link rel="modulepreload" crossorigin href="/magellan/assets/qr-tools-CMQuJEzd.js">
  <link rel="stylesheet" crossorigin href="/magellan/assets/compile-runtime-zXjloEkS.css">
  <link rel="stylesheet" crossorigin href="/magellan/assets/game-flpV_yww.css">
</head>
<body class="game-page">
<div class="game-shell">
<canvas id="game-canvas" aria-label="Magellan game"></canvas>
<div id="walk-joystick-left" class="walk-joystick left" aria-hidden="true"><div id="walk-stick-left" class="walk-stick"></div></div>
<div id="walk-joystick-right" class="walk-joystick right" aria-hidden="true"><div id="walk-stick-right" class="walk-stick"></div></div>
<button id="action-blue" class="action-box left" type="button" hidden></button>
<button id="action-red" class="action-box right" type="button" hidden></button>
<div id="game-loading" class="game-loading" role="status">
<div class="game-loading-pixels" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
<p id="game-loading-text">Loading…</p>
</div>
<div id="game-character-select" class="character-select" hidden>
<h1 class="character-select-title">Choose your players</h1>
<label class="character-select-option">Players on this device
<select id="local-player-count"><option value="1" selected>One — Right player</option><option value="2">Two — Left and Right</option></select></label>
<div class="character-select-pair">
<div id="left-player-card" class="character-select-card" hidden><h2>Left · WASD</h2>
<canvas id="preview-blue" class="character-preview" aria-label="Left player preview"></canvas>
<div class="character-select-row"><span class="character-select-label">Clothes</span><div id="clothes-blue" class="swatch-row" role="radiogroup" aria-label="Left player's clothes color"></div></div>
<div class="character-select-row"><span class="character-select-label">Hair</span><div id="hair-blue" class="swatch-row" role="radiogroup" aria-label="Left player's hair color"></div></div>
</div>
<div class="character-select-card"><h2>Right · Arrow keys</h2>
<canvas id="preview-red" class="character-preview" aria-label="Right player preview"></canvas>
<div class="character-select-row"><span class="character-select-label">Clothes</span><div id="clothes-red" class="swatch-row" role="radiogroup" aria-label="Right player's clothes color"></div></div>
<div class="character-select-row"><span class="character-select-label">Hair</span><div id="hair-red" class="swatch-row" role="radiogroup" aria-label="Right player's hair color"></div></div>
</div>
</div>
<label id="map-source-field" class="character-select-option" for="map-source" hidden>Map
<select id="map-source"></select>
</label>
<label class="character-select-option" for="character-select-fog-difficulty">Explored terrain, once out of sight:
<select id="character-select-fog-difficulty">
<option value="easy">Easy - stays fully visible</option>
<option value="medium" selected>Medium - dims to shadow</option>
<option value="hard">Hard - hidden again</option>
</select>
</label>
<div class="device-actions"><button id="add-device" type="button">Add a device</button><a id="join-device-link" href="game.html?join=1">Join another device</a></div>
<section id="device-pairing" hidden aria-label="Pair a device">
<p id="pairing-status" role="status"></p>
<canvas id="pairing-qr" hidden aria-label="Device pairing QR code"></canvas>
<div class="device-actions"><button id="pairing-scan" type="button">Scan reply</button><button id="pairing-cancel" type="button">Remove device</button></div>
</section>
<p id="character-select-status" class="character-select-status">Compiling terrain…</p>
<button id="character-select-start" class="character-select-start" type="button" disabled>Let's go!</button>
</div>
<div id="game-victory" class="game-victory" role="status" hidden>Victory!</div>
</div>
</body></html>
